apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: frontend
          ports:
            - containerPort: 3004
            - containerPort: 3005
            - containerPort: 3006
---
apiVersion: v1
kind: Service
metadata:
  name: react-app-service-lb
spec:
  selector:
    app: react-app
  ports:
    - name: port-3004
      port: 3004
      targetPort: 3004
    - name: port-3005
      port: 3005
      targetPort: 3005
    - name: port-3006
      port: 3006
      targetPort: 3006
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: react-app-service-np
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3004
      nodePort: 30000
  selector:
    app: react-app